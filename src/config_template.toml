# Change the name to config.toml and fill it with the appropriate values in production.

[app]
# Path prefix the app is served under, without slashes (e.g. "myapp").
# Leave it empty ("") to serve the app at the root.
ROOT_PATH = "..."
# Public URL of the site, without ROOT_PATH (e.g. "https://example.com").
# Links in emails are built from it, never from the request's Host header.
PUBLIC_URL = "..."

[database]
DB_HOST = "..."
DB_PORT = 5432
DB_NAME = "..."
DB_USERNAME = "..."
DB_PASSWORD = "..."

[security]
JWT_SIGNING_SECRET_KEY = "..."

[google]
# GOOGLE_REDIRECT_URI: public URL of /auth/google/callback (including ROOT_PATH),
# exactly as registered in Google. The OAuth state cookie is scoped to it.
GOOGLE_CLIENT_ID     = "..."
GOOGLE_CLIENT_SECRET = "..."
GOOGLE_REDIRECT_URI  = "..."

[email]
# "console" writes emails to the log instead of sending them (development only:
# the links in them are secrets). "smtp" sends them with the settings below.
BACKEND = "console"
FROM_ADDRESS = "..."
SMTP_HOST = "..."
SMTP_PORT = 587
SMTP_USERNAME = "..."
SMTP_PASSWORD = "..."
# "starttls" (usually port 587), "ssl" (usually 465) or "none" (local test servers only).
SMTP_SECURITY = "starttls"

# Optional section: these are the defaults.
[rate_limits]
# Counters are kept in memory, per process. With several workers, use a shared
# store, e.g. "redis://localhost:6379" (needs the redis package: uv add redis).
STORAGE_URI = "memory://"
# Limits in the "limits" notation: "5/15minutes", "10 per hour", ...
# Failed sign-ins in a row per IP and email (a successful sign-in resets it).
LOGIN_FAILURES_PER_ACCOUNT = "5/15minutes"
LOGIN_ATTEMPTS_PER_IP = "30/15minutes"
# Reset, verification and email-change emails per address, and their requests per IP.
# EMAILS_PER_ADDRESS also limits sign-ups per address, since each one emails a link.
EMAILS_PER_ADDRESS = "3/hour"
EMAIL_REQUESTS_PER_IP = "10/hour"
REGISTRATIONS_PER_IP = "10/hour"
# Wrong current passwords in a row, per account, counted together for changing the
# password or the email and deleting the account (a correct one resets it).
PASSWORD_CHANGE_FAILURES_PER_ACCOUNT = "5/15minutes"
