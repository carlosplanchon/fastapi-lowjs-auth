{# templates/login.html #}
<!DOCTYPE html>
<html lang="en" x-data="authApp()">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Tailwind compilado con build_css.sh -->
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <!-- Alpine.js servido localmente, versión fija -->
  <script defer src="{{ url_for('static', path='alpine-3.17.4.min.js') }}"></script>

  <title>Account</title>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="bg-white shadow p-8 rounded-lg">

      <!-- PANEL LOGIN ----------------------------------------------------- -->
      <template x-if="view==='login'">
        <div>
          <h1 class="text-2xl font-semibold text-center mb-6">Sign in</h1>

          <!-- Google -->
          <button
            class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded px-4 py-2 mb-6 hover:bg-gray-50 transition"
            @click="google()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" class="h-5">
            <span>Sign in with Google</span>
          </button>

          <!-- Email / password -->
          <form @submit.prevent="login" class="space-y-4">
            <input x-model="email" type="email" placeholder="Email" required
                   aria-label="Email" autocomplete="username"
                   class="w-full border rounded px-3 py-2">
            <input x-model="password" type="password" placeholder="Password" required
                   aria-label="Password" autocomplete="current-password"
                   class="w-full border rounded px-3 py-2">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
              Sign in
            </button>
          </form>

          <p class="text-sm text-center mt-4">
            <a href="#" @click.prevent="show('forgot')"
               class="text-blue-600 hover:underline">Forgot your password?</a>
          </p>

          <p class="text-sm text-center mt-2">
            Don't have an account?
            <a href="#" @click.prevent="show('register')"
               class="text-blue-600 hover:underline">Sign up</a>
          </p>
        </div>
      </template>

      <!-- PANEL REGISTRO -------------------------------------------------- -->
      <template x-if="view==='register'">
        <div>
          <h1 class="text-2xl font-semibold text-center mb-6">Create account</h1>

          <form @submit.prevent="register" class="space-y-4">
            <input x-model="email" type="email" placeholder="Email" required
                   aria-label="Email" autocomplete="username"
                   class="w-full border rounded px-3 py-2">
            <input x-model="password" type="password" placeholder="Password" required
                   minlength="{{ min_password_length }}"
                   aria-label="Password" autocomplete="new-password"
                   class="w-full border rounded px-3 py-2">
            <input x-model="password2" type="password" placeholder="Confirm password" required
                   aria-label="Confirm password" autocomplete="new-password"
                   class="w-full border rounded px-3 py-2">
            <button type="submit"
                    class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
              Sign up
            </button>
          </form>

          <p class="text-sm text-center mt-4">
            Already have an account?
            <a href="#" @click.prevent="show('login')"
               class="text-blue-600 hover:underline">Sign in</a>
          </p>
        </div>
      </template>

      <!-- PANEL FORGOT PASSWORD ------------------------------------------- -->
      <template x-if="view==='forgot'">
        <div>
          <h1 class="text-2xl font-semibold text-center mb-6">Reset your password</h1>

          <form @submit.prevent="forgotPassword" class="space-y-4">
            <input x-model="email" type="email" placeholder="Email" required
                   aria-label="Email" autocomplete="username"
                   class="w-full border rounded px-3 py-2">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
              Send reset link
            </button>
          </form>

          <p class="text-sm text-center mt-4">
            <a href="#" @click.prevent="show('login')"
               class="text-blue-600 hover:underline">Back to sign in</a>
          </p>
        </div>
      </template>

      <!-- PANEL RESET PASSWORD -------------------------------------------- -->
      <template x-if="view==='reset'">
        <div>
          <h1 class="text-2xl font-semibold text-center mb-6">Choose a new password</h1>

          <form @submit.prevent="resetPassword" class="space-y-4">
            <input x-model="password" type="password" placeholder="New password" required
                   minlength="{{ min_password_length }}"
                   aria-label="New password" autocomplete="new-password"
                   class="w-full border rounded px-3 py-2">
            <input x-model="password2" type="password" placeholder="Confirm new password" required
                   aria-label="Confirm new password" autocomplete="new-password"
                   class="w-full border rounded px-3 py-2">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
              Save password
            </button>
          </form>
        </div>
      </template>

      <!-- PANEL DASHBOARD ------------------------------------------------- -->
      <template x-if="view==='dashboard'">
        <div>
          <h1 class="text-2xl font-semibold text-center mb-6">My account</h1>

          <p class="mb-4"><strong>ID:</strong> <span x-text="user.id"></span></p>
          <p class="mb-4"><strong>Email:</strong> <span x-text="user.email"></span></p>
          <p class="mb-6"><strong>Status:</strong> <span x-text="user.is_verified ? 'Verified' : 'Not verified'"></span></p>

          <template x-if="!user.is_verified">
            <button @click="resendVerification"
                    class="w-full border border-gray-300 rounded py-2 mb-4 hover:bg-gray-50 transition">
              Resend verification email
            </button>
          </template>

          <button @click="logout"
                  class="w-full bg-gray-800 text-white py-2 rounded hover:bg-black transition">
            Sign out
          </button>
        </div>
      </template>

      <!-- Messages: always in the page, so screen readers announce changes. -->
      <div class="mt-4 text-sm text-center">
        <p x-text="error" role="alert" class="text-red-600"></p>
        <p x-text="notice" role="status" class="text-green-700"></p>
      </div>
    </div>
  </div>

  <!-- Logic -------------------------------------------------------------- -->
  <script>
  // fastapi-users error codes, as messages for people.
  const ERROR_MESSAGES = {
    LOGIN_BAD_CREDENTIALS: "Incorrect email or password.",
    REGISTER_USER_ALREADY_EXISTS: "An account with this email already exists.",
    RESET_PASSWORD_BAD_TOKEN: "This reset link is invalid or has expired. Please request a new one.",
    VERIFY_USER_BAD_TOKEN: "This verification link is invalid or has expired.",
    // From the Google callback, which redirects back here with #error=...
    GOOGLE_CANCELLED: "Google sign-in was cancelled.",
    GOOGLE_FAILED: "Google sign-in failed. Please try again.",
  };

  function errorMessage(error) {
    const detail = error.detail;
    if (typeof detail === "string" && ERROR_MESSAGES[detail]) return ERROR_MESSAGES[detail];
    // e.g. {"code": "REGISTER_INVALID_PASSWORD", "reason": "Password should be ..."}
    if (detail && detail.reason) return detail.reason;
    if (error.status === 429) {
      const minutes = Math.max(1, Math.ceil((error.retryAfter || 60) / 60));
      return `Too many attempts. Please try again in ${minutes} minute${minutes === 1 ? "" : "s"}.`;
    }
    if (error.status === 422) return "Please enter a valid email address.";
    return "Something went wrong. Please try again.";
  }

  function authApp() {
    const BASE_URL = "{{ base_url }}";   // <- Returned by FastAPI as str.

    return {
      /* state ----------------------------------------------------------- */
      view: "login",
      email: "", password: "", password2: "",
      error: "", notice: "", user: {}, resetToken: "",

      /* lifecycle ---------------------------------------------------- */
      async init() {
        // Sessions live in an HttpOnly cookie now; drop the token older versions kept here.
        localStorage.removeItem("token");
        // A link opened in a tab already showing this page only changes the
        // fragment, so the page doesn't reload: handle it here too.
        window.addEventListener("hashchange", () => this.openLink());
        await this.openLink();
      },

      async openLink() {
        // Links carry their data in the URL fragment, which is never sent to the
        // server: #error (Google sign-in), #reset_token and #verify_token (emails).
        const params = new URLSearchParams(window.location.hash.slice(1));
        if (window.location.hash) history.replaceState({}, "", window.location.pathname);

        if (params.get("error")) this.error = errorMessage({ detail: params.get("error") });
        if (params.get("reset_token")) {
          this.resetToken = params.get("reset_token");
          this.show("reset");
          return;
        }
        if (params.get("verify_token")) await this.verifyEmail(params.get("verify_token"));

        // JavaScript can't see the session cookie: ask the server.
        await this.fetchMe();
      },

      /* helpers ---------------------------------------------------------- */
      async api(path, opts={}) {
        const headers = {};
        // JSON bodies are strings; URLSearchParams sets its own Content-Type.
        if (typeof opts.body === "string") headers["Content-Type"] = "application/json";
        // Same-origin requests carry the session cookie on their own.
        const res = await fetch(BASE_URL + path, { headers, ...opts });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          const error = new Error(`HTTP ${res.status}`);
          error.status = res.status;
          error.detail = data && data.detail;
          error.retryAfter = Number(res.headers.get("Retry-After"));
          throw error;
        }
        return data;
      },

      show(view) {
        this.view = view;
        this.error = this.notice = "";
      },

      /* actions --------------------------------------------------------- */
      async register() {
        this.error = this.notice = "";
        if (this.password !== this.password2) {
          this.error = "Passwords don't match.";
          return;
        }
        try {
          await this.api("/auth/register", {
            method: "POST",
            body: JSON.stringify({ email: this.email, password: this.password })
          });
          await this.login();            // login automático
          if (this.view === "dashboard") this.notice = "We've sent you a link to verify your email.";
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async login() {
        this.error = this.notice = "";
        try {
          // fastapi-users' login route expects an OAuth2 form, not JSON. It answers
          // with the session cookie.
          await this.api("/auth/cookie/login", {
            method: "POST",
            body: new URLSearchParams({ username: this.email, password: this.password })
          });
          await this.fetchMe();
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async fetchMe() {
        try {
          this.user = await this.api("/me");
          this.view = "dashboard";
        } catch (e) {
          // 401 just means there's no session; anything else is a real error.
          if (e.status !== 401) this.error = errorMessage(e);
          this.view = "login";
        }
      },

      async verifyEmail(token) {
        this.error = this.notice = "";
        try {
          await this.api("/auth/verify", { method: "POST", body: JSON.stringify({ token }) });
          this.notice = "Your email is verified.";
        } catch (e) {
          if (e.detail === "VERIFY_USER_ALREADY_VERIFIED") this.notice = "Your email is already verified.";
          else this.error = errorMessage(e);
        }
      },

      async resendVerification() {
        this.error = this.notice = "";
        try {
          await this.api("/auth/request-verify-token", {
            method: "POST",
            body: JSON.stringify({ email: this.user.email })
          });
          this.notice = "We've sent you a new verification link.";
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async forgotPassword() {
        this.error = this.notice = "";
        try {
          await this.api("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: this.email })
          });
          // Same answer whether the account exists or not.
          this.notice = "If an account exists for that email, we've sent a link to reset your password.";
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async resetPassword() {
        this.error = this.notice = "";
        if (this.password !== this.password2) {
          this.error = "Passwords don't match.";
          return;
        }
        try {
          await this.api("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token: this.resetToken, password: this.password })
          });
          this.password = this.password2 = this.resetToken = "";
          this.show("login");
          this.notice = "Your password has been updated. You can sign in now.";
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async logout() {
        try {
          // Ends the session in the database and clears the cookie.
          await this.api("/auth/cookie/logout", { method: "POST" });
        } catch (e) {
          // Already signed out (401): nothing left to end.
          if (e.status !== 401) {
            this.error = errorMessage(e);
            return;
          }
        }
        this.email = this.password = this.password2 = "";
        this.show("login");
      },

      google() {
        window.location.href = BASE_URL + "/auth/google/login";
      }
    };
  }
  </script>
</body>
</html>
