{# templates/login.html #}
<!DOCTYPE html>
<html lang="en" x-data="authApp()">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Tailwind compilado con build_css.sh -->
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <!-- Alpine.js servido localmente, versión fija -->
  <script defer src="{{ url_for('static', path='alpine-3.17.4.min.js') }}"></script>

  <title>Account</title>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md">

    <!-- PANEL LOGIN ------------------------------------------------------- -->
    <template x-if="view==='login'">
      <div class="bg-white shadow p-8 rounded-lg">
        <h1 class="text-2xl font-semibold text-center mb-6">Sign in</h1>

        <!-- Google -->
        <button
          class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded px-4 py-2 mb-6 hover:bg-gray-50 transition"
          @click="google()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" class="h-5">
          <span>Sign in with Google</span>
        </button>

        <!-- Email / password -->
        <form @submit.prevent="login" class="space-y-4">
          <input x-model="email" type="email" placeholder="Email" required
                 aria-label="Email" autocomplete="username"
                 class="w-full border rounded px-3 py-2">
          <input x-model="password" type="password" placeholder="Password" required
                 aria-label="Password" autocomplete="current-password"
                 class="w-full border rounded px-3 py-2">
          <button type="submit"
                  class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
            Sign in
          </button>
        </form>

        <p class="text-sm text-center mt-4">
          Don't have an account?
          <a href="#" @click.prevent="view='register'"
             class="text-blue-600 hover:underline">Sign up</a>
        </p>

        <p x-text="error" role="alert" class="text-red-600 text-sm mt-4 text-center"></p>
      </div>
    </template>

    <!-- PANEL REGISTRO ---------------------------------------------------- -->
    <template x-if="view==='register'">
      <div class="bg-white shadow p-8 rounded-lg">
        <h1 class="text-2xl font-semibold text-center mb-6">Create account</h1>

        <form @submit.prevent="register" class="space-y-4">
          <input x-model="email" type="email" placeholder="Email" required
                 aria-label="Email" autocomplete="username"
                 class="w-full border rounded px-3 py-2">
          <input x-model="password" type="password" placeholder="Password" required
                 minlength="{{ min_password_length }}"
                 aria-label="Password" autocomplete="new-password"
                 class="w-full border rounded px-3 py-2">
          <input x-model="password2" type="password" placeholder="Confirm password" required
                 aria-label="Confirm password" autocomplete="new-password"
                 class="w-full border rounded px-3 py-2">
          <button type="submit"
                  class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
            Sign up
          </button>
        </form>

        <p class="text-sm text-center mt-4">
          Already have an account?
          <a href="#" @click.prevent="view='login'"
             class="text-blue-600 hover:underline">Sign in</a>
        </p>

        <p x-text="error" role="alert" class="text-red-600 text-sm mt-4 text-center"></p>
      </div>
    </template>

    <!-- PANEL DASHBOARD --------------------------------------------------- -->
    <template x-if="view==='dashboard'">
      <div class="bg-white shadow p-8 rounded-lg">
        <h1 class="text-2xl font-semibold text-center mb-6">My account</h1>

        <p class="mb-4"><strong>ID:</strong> <span x-text="user.id"></span></p>
        <p class="mb-6"><strong>Email:</strong> <span x-text="user.email"></span></p>

        <button @click="logout"
                class="w-full bg-gray-800 text-white py-2 rounded hover:bg-black transition">
          Sign out
        </button>
      </div>
    </template>

  </div>

  <!-- Logic -------------------------------------------------------------- -->
  <script>
  // fastapi-users error codes, as messages for people.
  const ERROR_MESSAGES = {
    LOGIN_BAD_CREDENTIALS: "Incorrect email or password.",
    REGISTER_USER_ALREADY_EXISTS: "An account with this email already exists.",
  };

  function errorMessage(error) {
    const detail = error.detail;
    if (typeof detail === "string" && ERROR_MESSAGES[detail]) return ERROR_MESSAGES[detail];
    // e.g. {"code": "REGISTER_INVALID_PASSWORD", "reason": "Password should be ..."}
    if (detail && detail.reason) return detail.reason;
    if (error.status === 422) return "Please enter a valid email address.";
    return "Something went wrong. Please try again.";
  }

  function authApp() {
    const BASE_URL = "{{ base_url }}";   // <- Returned by FastAPI as str.

    return {
      /* state ----------------------------------------------------------- */
      view: "login",
      email: "", password: "", password2: "",
      error: "", user: {},

      /* lifecycle ---------------------------------------------------- */
      init() {
        // Capture token if it comes from Google (#token=xxx). It travels in the
        // URL fragment, which is never sent to the server.
        const t = new URLSearchParams(window.location.hash.slice(1)).get("token");
        if (t) {
          localStorage.setItem("token", t);
          history.replaceState({}, "", window.location.pathname);
        }

        const token = localStorage.getItem("token");
        if (token) this.fetchMe();
      },

      /* helpers ---------------------------------------------------------- */
      async api(path, opts={}) {
        const token = localStorage.getItem("token");
        const headers = {};
        // JSON bodies are strings; URLSearchParams sets its own Content-Type.
        if (typeof opts.body === "string") headers["Content-Type"] = "application/json";
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch(BASE_URL + path, { headers, ...opts });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          const error = new Error(`HTTP ${res.status}`);
          error.status = res.status;
          error.detail = data && data.detail;
          throw error;
        }
        return data;
      },

      /* actions --------------------------------------------------------- */
      async register() {
        this.error = "";
        if (this.password !== this.password2) {
          this.error = "Passwords don't match.";
          return;
        }
        try {
          await this.api("/auth/register", {
            method: "POST",
            body: JSON.stringify({ email: this.email, password: this.password })
          });
          await this.login();            // login automático
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async login() {
        this.error = "";
        try {
          // fastapi-users' login route expects an OAuth2 form, not JSON.
          const data = await this.api("/auth/jwt/login", {
            method: "POST",
            body: new URLSearchParams({ username: this.email, password: this.password })
          });
          localStorage.setItem("token", data.access_token);
          await this.fetchMe();
        } catch (e) {
          this.error = errorMessage(e);
        }
      },

      async fetchMe() {
        try {
          this.user = await this.api("/me");
          this.view = "dashboard";
        } catch (e) {
          // Only drop the token when the server rejects it, not on a network error.
          if (e.status === 401) localStorage.removeItem("token");
          else this.error = errorMessage(e);
          this.view = "login";
        }
      },

      logout() {
        localStorage.removeItem("token");
        this.email = this.password = this.password2 = "";
        this.view = "login";
      },

      google() {
        window.location.href = BASE_URL + "/auth/google/login";
      }
    };
  }
  </script>
</body>
</html>
