name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit: a tag can be moved, a commit can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Ruff's findings don't depend on the Python it runs under: once is enough.
      # It takes the oldest version in requires-python as its target, so syntax
      # newer than that fails here.
      - name: Lint
        run: uv run ruff check

      - name: Check that the compiled CSS is up to date
        run: |
          bash build_css.sh
          git diff --exit-code -- src/web/static/app.css \
            || { echo "::error::src/web/static/app.css is out of date: run 'bash build_css.sh' and commit it."; exit 1; }

  # The tests on every Python version the app supports (requires-python in
  # pyproject.toml): on SQLite, then on Postgres, where transactions and migrations
  # behave as in production. Each test creates and drops a database of its own on
  # this server.
  tests:
    runs-on: ubuntu-latest
    strategy:
      # A failure on one version doesn't cancel the others: the results show which
      # versions it affects.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    services:
      postgres:
        # The same Postgres as the compose templates.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Over TCP: during first-run init it only listens on a socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python-version sets UV_PYTHON, which overrides .python-version: uv installs
      # that Python and builds the environment with it.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run tests on Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Like a real deployment: the compose template filled in, and src/config.toml
      # where the real one goes. Both hold a password that must stay out of the image.
      - name: Fill in the Docker Compose template and the config
        run: |
          sed -e 's/POSTGRES_PASSWORD=\.\.\./POSTGRES_PASSWORD=ci-secret-not-in-image/' \
              -e 's/POSTGRES_USER=\.\.\./POSTGRES_USER=app/' \
              -e 's/POSTGRES_DB=\.\.\./POSTGRES_DB=app/' \
              docker-compose_template.yaml > docker-compose.yml
          cat > src/config.toml <<'EOF'
          [app]
          ROOT_PATH = ""
          PUBLIC_URL = "http://127.0.0.1:8000"

          [database]
          DB_HOST = "postgres"
          DB_PORT = 5432
          DB_NAME = "app"
          DB_USERNAME = "app"
          DB_PASSWORD = "ci-secret-not-in-image"

          [security]
          JWT_SIGNING_SECRET_KEY = "ci-secret-not-in-image-and-at-least-32-bytes"

          [google]
          GOOGLE_CLIENT_ID = "ci"
          GOOGLE_CLIENT_SECRET = "ci-secret-not-in-image"
          GOOGLE_REDIRECT_URI = "http://127.0.0.1:8000/auth/google/callback"

          [email]
          BACKEND = "console"
          FROM_ADDRESS = "no-reply@example.com"
          EOF

      - name: Build the image and start Postgres and the API
        run: docker compose up -d --build

      # The first request also waits for the migrations and the server to start.
      - name: Check that the API serves the sign-in page and its files
        run: |
          for path in login static/app.css static/app.js; do
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
              -o /dev/null "http://127.0.0.1:8000/$path"
          done

      - name: Check that no secret ended up in the image
        run: |
          # grep exits with 1 when it finds nothing: 0 would mean a leak, 2 an error.
          status=0
          docker compose run --rm --no-deps -T api grep -rq ci-secret-not-in-image /app || status=$?
          test "$status" -eq 1

      - name: Show the logs
        if: failure()
        run: docker compose logs
