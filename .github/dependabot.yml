# Weekly pull requests that keep the dependencies up to date: minor and patch
# updates grouped in one pull request per ecosystem, major ones one by one.
# New releases wait a week first, since a compromised release is usually caught
# within days. (GitHub's container registry gives Dependabot no release dates,
# so the uv image skips the wait.)
version: 2
updates:
  # The actions in .github/workflows, pinned by commit: Dependabot updates the
  # commit and the version comment next to it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Python packages in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # A new Python version is a decision of its own (.python-version, requires-python).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A new major version of Postgres (compose templates) can't read the
      # previous one's data directory.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
