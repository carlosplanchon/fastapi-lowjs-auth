[project]
name = "fastapi-lowjs-auth"
version = "1.0.0"
description = "LowJS Authentication FastAPI template. Supports Google Authentication and Email / Password."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.121.0",
    "fastapi-sso>=0.18.0",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "jinja2>=3.1.6",
    "limits>=5.8.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.13.1",
    "ipython>=9.2.0",
    "prettyprinter>=0.18.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-n", "logical"]

[tool.ruff.lint]
# Ruff's default rules (likely bugs, modern syntax, import order...), plus these
# error rules in full. The defaults come with ruff's version, which uv.lock pins:
# when Dependabot bumps it, new findings show up in that pull request's CI.
extend-select = [
    "F",      # pyflakes: unused imports and variables, undefined names
    "E4",     # pycodestyle errors a formatter doesn't fix: imports,
    "E7",     #   statements (bare except, ...),
    "E9",     #   syntax and I/O errors
    "W6",     # invalid escape sequences
    "PLE",    # pylint errors
    "ASYNC",  # blocking calls inside async functions
    "BLE",    # except Exception that hides the error
    "S110",   # try/except/pass
    "T10",    # leftover breakpoint() and pdb
    "FAST",   # FastAPI: dependencies declared with Annotated, and other mistakes
]

[tool.ruff.lint.per-file-ignores]
# Migrations keep the template's imports (op, sa...) even when unused, ready for
# the ones written by hand.
"src/migrations/versions/*.py" = ["F401"]
